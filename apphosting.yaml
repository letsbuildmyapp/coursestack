# Firebase App Hosting config
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Static SPA — minimum instances, low memory, scale-to-zero
  minInstances: 0
  maxInstances: 1
  cpu: 1
  memoryMiB: 512
  concurrency: 80

# Public env vars get bundled into the client at build time.
# These are the Firebase web SDK config — public, safe to ship.
env:
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyCVVEMbBggYqsqTCegE0IS4jfM6RvI_3KA
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_AUTH_DOMAIN
